[build-system]
requires = ["poetry_core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "parasite"
version = "0.1.0"
description = "parasite—pandoc centric static site generator"
license = "BSD-3-Clause"
keywords = [
    "pandoc",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "License :: OSI Approved :: BSD License",
    "Operating System :: Unix",
    "Operating System :: POSIX",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Utilities",
]
homepage = "https://github.com/ickc/parasite"
repository = "https://github.com/ickc/parasite"
documentation = "https://ickc.github.io/parasite"
authors = ["Kolen Cheung <christian.kolen@gmail.com>"]
readme = "README.rst"
packages = [
    { include = "parasite", from = "src" },
]
include = [
    'LICENSE',
    'README.rst',
    'src/parasite/templates/*.html',
]

[tool.poetry.dependencies]
python = ">=3.8"
custom-inherit = "^2.4"
panflute = "^2.1"
parsl = "^1.1"
urlpath = "^1.1"
defopt = "^6"
ujson = "^4"
feedgen = "^0.9"

# extras
coloredlogs = { optional = true, version = ">=14,<16" }
watchdog = { optional = true, version = "^2" }
livereload = { optional = true, version = "^2" }

# tests
coverage = { optional = true, version = "*" }
coveralls = { optional = true, version = "*" }
flake8 = { optional = true, version = "*" }
pytest = { optional = true, version = "*" }
pytest-cov = { optional = true, version = "*" }
pytest-parallel = { optional = true, version = "*" }
pytest-xdist = { optional = true, version = "*" }

# docs
sphinx = { optional = true, version = "^3.3" }
sphinx-bootstrap-theme = { optional = true, version = "*" }
sphinxcontrib-apidoc = { optional = true, version = "*" }
pantable = { optional = true, version = "^0.14" }

[tool.poetry.dev-dependencies]
ipykernel = "*"
isort = "*"
mypy = "*"
bandit = "*"
black = "*"
bump2version = "*"
pandoc-crossref = "*"
ghp-import = "^2"
nbconvert = "^6"
pylint = "*"
rstcheck = "*"
types-pyyaml = "*"
makefun = "^1.11"
nbsphinx = ">=0.8"
pandas = "*"

[tool.poetry.extras]
extras = [
    "coloredlogs",
    "watchdog",
    "livereload",
]
tests = [
    "coverage",
    "coveralls",
    "flake8",
    "pytest",
    "pytest-cov",
    "pytest-parallel",
    "pytest-xdist",
]
docs = [
    "sphinx",
    "sphinx-bootstrap-theme",
    "sphinxcontrib-apidoc",
    "pantable",
]

[tool.poetry.scripts]
parasite = 'parasite.pipeline:cli'
# parasite_serial = 'parasite.pipeline_serial:cli'

[tool.coverage.paths]
source = [
    'src',
    '*/site-packages',
]

[tool.coverage.run]
branch = true
source = [
    'src',
    'tests',
]
parallel = true
relative_files = true

[tool.coverage.report]
show_missing = true
precision = 2

[tool.pytest.ini_options]

addopts = [
    '-ra',
    '--strict-markers',
    '--tb=auto',
]

testpaths = [
    'tests',
]

[tool.isort]
line_length = 88
known_first_party = 'parasite'
default_section = 'THIRDPARTY'
forced_separate = 'tests'
profile = 'black'
skip = [
    '.eggs',
    'ci/templates',
    'build',
    'dist',
]

[tool.pylint.messages_control]
disable = "C0330, C0326"

[tool.pylint.format]
max-line-length = 88

[tool.black]
line-length = 88
experimental-string-processing = true
target-version = ['py37']
