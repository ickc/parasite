[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pandoc-parasite"
version = "0.1.0"
description = "parasite—pandoc centric static site generator"
readme = "README.rst"
license = "BSD-3-Clause"
authors = [{ name = "Kolen Cheung", email = "christian.kolen@gmail.com" }]
keywords = ["pandoc", "static site generator"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
]
# pandoc >= 3.1 is required too, from conda-forge or pandoc.org: not on PyPI
requires-python = ">=3.12"
dependencies = [
    "custom-inherit>=2.4",
    "panflute>=2.3.1,<2.4",
    "urlpath>=1.1",
    "defopt>=7",
    "feedgen>=1",
]

[project.optional-dependencies]
extras = [
    "coloredlogs>=14",
    "watchdog>=2",
    "livereload>=2",
]
tests = [
    "coverage",
    "pytest",
    "pytest-cov",
]

[project.scripts]
parasite = "parasite.pipeline:cli"

[project.urls]
Homepage = "https://github.com/ickc/parasite"
Repository = "https://github.com/ickc/parasite"

[tool.hatch.build.targets.wheel]
packages = ["src/parasite"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.coverage.paths]
source = [
    'src',
    '*/site-packages',
]

[tool.coverage.run]
branch = true
source = [
    'src',
    'tests',
]
parallel = true
relative_files = true

[tool.coverage.report]
show_missing = true
precision = 2

[tool.pytest.ini_options]

addopts = [
    '-ra',
    '--strict-markers',
    '--tb=auto',
]

testpaths = [
    'tests',
]

[tool.mypy]
#* Import discovery
mypy_path = "src"
# files
# exclude
# namespace_packages
# explicit_package_bases
ignore_missing_imports = true
# follow_imports
# follow_imports_for_stubs
# python_executable
# no_site_packages
# no_silence_site_packages

#* Platform configuration...

#* Disallow dynamic typing
disallow_any_unimported = false
disallow_any_expr = false
disallow_any_decorated = false
disallow_any_explicit = false
disallow_any_generics = true
disallow_subclassing_any = false

#* Untyped definitions and calls
disallow_untyped_calls = false
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false

#* None and Optional handling
no_implicit_optional = true
strict_optional = true

#* Configuring warnings
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_return_any = false
warn_unreachable = true

#* Suppressing errors...

#* Miscellaneous strictness flags...

#* Configuring error messages
show_error_context = false
show_column_numbers = false
show_error_codes = true
pretty = false
color_output = true
error_summary = true
show_absolute_path = false

#* Incremental mode...

#* Advanced options...

#* Report generation...

#* Miscellaneous
# junit_xml
# scripts_are_modules
warn_unused_configs = true
# verbosity
