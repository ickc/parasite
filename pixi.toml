# Development environment: `pixi run test`.
[workspace]
name = "parasite"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[dependencies]
python = ">=3.12"
pandoc = ">=3.1"
pip = "*"
hatchling = "*"
# the dependencies in pyproject.toml, from conda-forge
custom-inherit = ">=2.4"
panflute = ">=2.3.1,<2.4"
defopt = ">=7"
feedgen = ">=1"
coloredlogs = "*"
watchdog = "*"
livereload = "*"
pytest = "*"
pytest-cov = "*"
ruff = "*"

[tasks]
install = "python -m pip install --no-deps --no-build-isolation -e ."
test = { cmd = "python -m pytest -vv tests", depends-on = ["install"] }
