name: Documentation

# built on every push and pull request; deployed to GitHub Pages from main only
on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.14"
    - uses: pandoc/actions/setup@v1
    - name: Install
      run: pip install -e '.[search]'
    - name: Install lychee (the build checks its links)
      run: |
        mkdir -p ~/.local/bin
        curl -sSfL https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-gnu.tar.gz \
          | tar -xz --strip-components=1 -C ~/.local/bin lychee-x86_64-unknown-linux-gnu/lychee
        echo ~/.local/bin >> "$GITHUB_PATH"
    - name: Build
      run: make docs
    - uses: actions/upload-pages-artifact@v3
      if: github.ref == 'refs/heads/main'
      with:
        path: docs/output

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - id: deployment
      uses: actions/deploy-pages@v4
