name: Documentation

# built on every push and pull request; published to GitHub Pages (the gh-pages branch)
# from main only
on: [push, pull_request]

permissions:
  contents: write  # to push gh-pages; nothing else writes

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.14"
    - uses: pandoc/actions/setup@v1
    - name: Install
      run: pip install -e '.[search]'
    - name: Install lychee (the build checks its links)
      run: |
        mkdir -p ~/.local/bin
        curl -sSfL https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-gnu.tar.gz \
          | tar -xz --strip-components=1 -C ~/.local/bin lychee-x86_64-unknown-linux-gnu/lychee
        echo ~/.local/bin >> "$GITHUB_PATH"
    - name: Build
      run: make docs
    # the site's Pages serves the gh-pages branch: push the build there, from main only
    - uses: peaceiris/actions-gh-pages@v4
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: docs/output
