# this should be very similar to https://github.com/conda-forge/parasite-feedstock/blob/master/recipe/meta.yaml
# run the following command to create a conda environment that is suitable for testing parasite
# conda env create -f environment.yml
# conda activate parasite
# python -m ipykernel install --user --name parasite --display-name parasite
# and then run this to install parasite in editable mode
# make editable
# update using
# conda env update --name parasite --file environment.yml --prune
name: parasite
channels:
  - conda-forge
dependencies:
  # host:
  - pip
  - python >=3.8
  - poetry >=1,<2
  # run:
  - custom-inherit>=2,<3
  - panflute >=2.1,<3
  - parsl >=1.1,<2
  - urlpath >=1.1,<2
  - defopt >=6,<7
  - ujson >=4,<5
  - feedgen >=0.9,<0.10
  # run_constrained:
  - pandoc >=2.11.2,<2.15
  - coloredlogs >=14,<16
  - watchdog >=2,<3
  - livereload >=2,<3
  # tests:
  - coverage
  - coveralls
  - flake8
  - pytest
  - pytest-cov
  - pytest-parallel
  - pytest-xdist
  # docs:
  - sphinx
  - sphinx_bootstrap_theme
  - sphinxcontrib-apidoc
  # dev:
  - pantable >=0.14,<0.15
  - ipykernel
  - isort
  - mypy
  - bandit
  - black
  - bump2version
  - pandoc-crossref
  - ghp-import >=2,<3
  - nbconvert >=6,<7
